name: eslint analysis

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  eslint:
    name: Run eslint
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run eslint
        run: |
          docker compose run --rm npm-root ci --ignore-scripts
          docker compose run --rm npm-root run lint:check
