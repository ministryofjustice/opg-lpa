name: "[Snyk] Container Monitor"

defaults:
  run:
    shell: bash

on:
  workflow_call:
    inputs:
      image_name:
        description: "ECR repository name, without the registry prefix"
        required: true
        type: string
      image_tag:
        description: "Tag of the pushed image to monitor"
        required: true
        type: string
      snyk_policy_path:
        description: "Path to the Snyk policy file for the image"
        required: false
        type: string
        default: ".snyk"
      oidc_role_to_assume:
        description: "OIDC role used to pull the image from ECR"
        required: true
        type: string
      ecr_registry_id:
        required: false
        type: string
        default: "311462405659"
      aws_region:
        required: false
        type: string
        default: "eu-west-1"
      snyk_cli_version:
        required: false
        type: string
        default: "1.1303.2"
    secrets:
      SNYK_TOKEN:
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  snyk_container_monitor:
    name: "Snyk monitor ${{ inputs.image_name }}"
    runs-on: ubuntu-latest
    env:
      IMAGE_REF: ${{ inputs.ecr_registry_id }}.dkr.ecr.${{ inputs.aws_region }}.amazonaws.com/${{ inputs.image_name }}:${{ inputs.image_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: ${{ inputs.oidc_role_to_assume }}
          role-duration-seconds: 3600
          role-session-name: OPGMakeaLPASnykMonitorGithubAction

      - name: ECR Login
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
        with:
          registries: ${{ inputs.ecr_registry_id }}

      - name: Pull pushed image
        run: docker pull "${IMAGE_REF}"

      - name: Snyk container monitor
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_CLI_VERSION: ${{ inputs.snyk_cli_version }}
          PROJECT_NAME: ${{ inputs.image_name }}
          POLICY_PATH: ${{ inputs.snyk_policy_path }}
        run: |
          npx --yes "snyk@${SNYK_CLI_VERSION}" container monitor "${IMAGE_REF}" \
            --project-name="${PROJECT_NAME}" \
            --policy-path="${POLICY_PATH}" \
            --project-lifecycle=production
