name: Psalm analysis

on: workflow_call

permissions:
  security-events: write

jobs:
  psalm:
    name: psalm-scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scan:
          - name: service-admin
            service: admin-app-test
          - name: service-front
            service: front-app-test
          - name: service-api
            service: api-app-test
          - name: shared
            service: shared-test
          - name: service-pdf
            service: pdf-app-test
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.scan.service }}
          path: /tmp/images

      - name: Load Images
        run: |
          docker load -i /tmp/images/image.tar

      - name: Run Psalm
        run: |
          mkdir -m 0777 ./output
          docker compose run --rm \
            --volume ./output:/tmp/output \
            ${{ matrix.scan.service }} \
            vendor/bin/psalm --report=/tmp/output/psalm-results.sarif --no-cache --force-jit
        continue-on-error: ${{ matrix.scan.ignoreFailures == true }}

      - name: Add prefix to Psalm paths
        if: always()
        run: |
          sed -i 's|"uri":"|"uri":"${{ matrix.scan.name }}\/|g' ./output/psalm-results.sarif

      - name: Upload Security Analysis results to GitHub
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        if: always()
        with:
          sarif_file: ./output/psalm-results.sarif
          category: psalm-${{ matrix.scan.name }}
