name: "[Workflow] Run Feedback DB Task"

defaults:
  run:
    shell: bash

on:
  workflow_call:
    inputs:
      task_name:
        description: "Name of the task to run"
        required: true
        type: string
      oidc_role:
        description: "Role to use to start an ECS task"
        required: true
        type: string

permissions:
  actions: none
  checks: none
  contents: write
  deployments: none
  id-token: write
  issues: none
  packages: none
  pull-requests: read
  repository-projects: none
  security-events: write
  statuses: none

jobs:
  run_seeding_task:
    name: Run seeding task
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Terraform Task definition
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: terraform-artifact
          path: /tmp/

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: eu-west-1
          role-to-assume: ${{ inputs.oidc_role }}
          role-duration-seconds: 900
          role-session-name: OPGLPABuildPipeline

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install Python dependencies
        working-directory: scripts/pipeline
        run: uv sync --locked

      - name: Start ECS task
        working-directory: scripts/pipeline
        run: uv run python start_task/ecs_start_task.py --task_name ${TASK_NAME}
        env:
          TASK_NAME: ${{ inputs.task_name }}
