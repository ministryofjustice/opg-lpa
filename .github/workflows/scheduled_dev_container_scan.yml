name: "Development Container Scan with Snyk"

defaults:
  run:
    shell: bash

on:
  # schedule:
  #   # Run Hourly
  #   - cron: "0 6 * * 1-5"
  pull_request:
    branches:
      - main

permissions:
  actions: none
  checks: none
  contents: write
  deployments: none
  id-token: write
  issues: none
  packages: none
  pull-requests: read
  repository-projects: none
  security-events: write
  statuses: none

jobs:
  otel_image_pull_and_scan:
    name: "OTEL_Image_Pull_and_Scan"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: postgres:14.18
          - image_name: library/redis:8.8-alpine
          - image_name: amazon/dynamodb-local
          - image_name: localstack/localstack:4.14.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: eu-west-1
          role-to-assume: ${{ vars.OIDC_DOCKER_ROLE }}
          role-duration-seconds: 3600
          role-session-name: OPGMakeaLPAECRGithubAction

      - name: ECR Login
        id: login_ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
        with:
          registries: 311462405659

      - name: Pull ${{ matrix.image_name }} image for scanning
        run: |
          docker pull ${{ matrix.image_name }}

      - name: Scan ${{ matrix.image_name }} image with SNYK
        id: otel_snyk_scan
        continue-on-error: false
        uses: ministryofjustice/opg-github-actions/actions/snyk-scan@722a5f955424aaba01e9ca43d68390cd4048d6e1 # v4.10.2
        with:
          SNYK_TEST_IMAGE: ${{ matrix.image_name }}
          SNYK_TOKEN: ${{ secrets.SNYK_OPG_ORG_TOKEN }}
          snyk_test_args: --severity-threshold=high
