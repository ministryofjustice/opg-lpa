name: Python lock-drift check

on:
  push:
    paths:
      - "**/*.toml"
      - "**/uv.lock"
  pull_request:
    paths:
      - "**/*.toml"
      - "**/uv.lock"
permissions:
  actions: none
  checks: none
  contents: read
  deployments: none
  id-token: none
  issues: none
  packages: none
  pull-requests: read
  repository-projects: none
  security-events: none
  statuses: none

jobs:
  uv-lock-check:
    name: uv lock --check (${{ matrix.directory }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: scripts/pipeline
          - directory: scripts/pipeline/ci_ingress
          - directory: scripts/call_api_gateway
          - directory: tests/python-api-client
          - directory: tests/sirius-gateway-mock/scripts
          - directory: tests/load
          - directory: locust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Check lock
        working-directory: ${{ matrix.directory }}
        run: uv lock --check
