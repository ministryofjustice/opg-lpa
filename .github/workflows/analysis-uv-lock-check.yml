name: Python lock-drift check

on:
  push:
    paths:
      - "**/*.toml"
      - "**/uv.lock"
  pull_request:
    paths:
      - "**/*.toml"
      - "**/uv.lock"
permissions:
  actions: none
  checks: none
  contents: read
  deployments: none
  id-token: none
  issues: none
  packages: none
  pull-requests: read
  repository-projects: none
  security-events: none
  statuses: none

jobs:
  uv-lock-check:
    name: uv lock --check (${{ matrix.directory }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: scripts/pipeline
          - directory: scripts/pipeline/ci_ingress
          - directory: scripts/call_api_gateway
          - directory: tests/python-api-client
          - directory: tests/sirius-gateway-mock/scripts
          - directory: tests/load
          - directory: locust
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: "0.11.21"
          enable-cache: true

      - name: Check lock
        working-directory: ${{ matrix.directory }}
        run: uv lock --check
