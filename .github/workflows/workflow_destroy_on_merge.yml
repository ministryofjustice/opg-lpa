name: "[Workflow] Destroy ephemeral environment"

defaults:
  run:
    shell: bash

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  actions: none
  checks: none
  contents: read
  deployments: write
  id-token: write
  issues: none
  packages: none
  pull-requests: read
  repository-projects: none
  security-events: write
  statuses: none

jobs:
  workspace_name:
    runs-on: ubuntu-latest
    outputs:
      safe_branch_name: ${{ steps.safe_branch_name.outputs.safe }}
    steps:
      - name: Set safe branch name
        id: safe_branch_name
        uses: ministryofjustice/opg-github-actions/actions/branch-name@ae37b9b322286123971417e82b665e56e9d6aa3f # v4.10.3
    if: github.event.pull_request.merged == true

  cleanup_workspace:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    needs:
      - workspace_name
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get terraform version
        id: set-terraform-version
        uses: ministryofjustice/opg-github-actions/actions/terraform-version@ae37b9b322286123971417e82b665e56e9d6aa3f # v4.10.3
        with:
          terraform_directory: "./terraform/environment"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.set-terraform-version.outputs.version }}
          terraform_wrapper: false

      - uses: ministryofjustice/opg-github-actions/actions/github-deploy-key@ae37b9b322286123971417e82b665e56e9d6aa3f # v4.10.3
        with:
          deploy_key: ${{ secrets.OPG_LPA_DEPLOY_KEY_PRIVATE_KEY }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: eu-west-1
          role-duration-seconds: 1800
          role-session-name: OPGLPADestroyEphemeralEnvironment
          role-to-assume: ${{ vars.OIDC_TERRAFORM_ROLE_DEVELOPMENT }}

      - name: Run workspace cleanup
        working-directory: ./terraform/environment
        env:
          TF_VAR_pagerduty_token: ${{ secrets.PAGERDUTY_TOKEN }}
          SAFE_BRANCH_NAME: ${{ needs.workspace_name.outputs.safe_branch_name }}
        run: |
          ../../scripts/pipeline/workspace_cleanup/destroy_workspace.sh ${{ github.event.number }}${SAFE_BRANCH_NAME}
