name: "[Merge Queue] Preproduction Integration"

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}

defaults:
  run:
    shell: bash

on:
  merge_group:
    types: [checks_requested]

permissions:
  actions: none
  checks: none
  contents: write # zizmor: ignore[excessive-permissions]
  deployments: write # zizmor: ignore[excessive-permissions]
  id-token: write # zizmor: ignore[excessive-permissions]
  issues: none
  packages: none
  pull-requests: read
  repository-projects: none
  security-events: write # zizmor: ignore[excessive-permissions]
  statuses: none

jobs:
  set_variables:
    name: Set variables
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.short_sha.outputs.short_sha }}
      semver_tag: ${{ steps.semver_tag.outputs.tag }}
      environment_terraform_version: ${{ steps.terraform_version_environment.outputs.version }}
      account_terraform_version: ${{ steps.terraform_version_account.outputs.version }}
      region_terraform_version: ${{ steps.terraform_version_region.outputs.version }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Set output to penultimate short SHA
        id: short_sha
        run: |
          echo "short_sha=$(git rev-list --no-merges -n 1 HEAD | cut -c1-7)" >> $GITHUB_OUTPUT
      - name: Set terraform version - environment
        id: terraform_version_environment
        uses: ministryofjustice/opg-github-actions/actions/terraform-version@ae37b9b322286123971417e82b665e56e9d6aa3f # v4.10.3
        with:
          terraform_directory: "./terraform/environment"
      - name: Set terraform version - region
        id: terraform_version_region
        uses: ministryofjustice/opg-github-actions/actions/terraform-version@ae37b9b322286123971417e82b665e56e9d6aa3f # v4.10.3
        with:
          terraform_directory: "./terraform/region"
      - name: Bump version and push tag
        uses: ministryofjustice/opg-github-actions/actions/semver@ae37b9b322286123971417e82b665e56e9d6aa3f # v4.10.3
        id: semver_tag
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: true
          create_release: false
          default_bump: minor

  terraform_lint:
    name: TF - Lint
    needs:
      - set_variables
    uses: ministryofjustice/opg-github-workflows/.github/workflows/linting-infrastructure-terraform.yml@84a762ecab4a2d6217be908505351fd1f9312319 # v3.19.19
    with:
      terraform_version: ${{ needs.set_variables.outputs.environment_terraform_version }}

  snyk_iac_scan:
    name: Snyk IAC Scan
    uses: ./.github/workflows/snyk_iac_scan.yml
    with:
      oidc_role: ${{ vars.OIDC_DOCKER_ROLE }}
    secrets:
      snyk_token: ${{ secrets.SNYK_OPG_ORG_TOKEN }}

  docker_build_scan_push:
    name: Docker Build, Scan and Push
    uses: ./.github/workflows/docker_job.yml
    needs:
      - set_variables
    with:
      oidc_docker_role: ${{ vars.OIDC_DOCKER_ROLE }}
      oidc_docker_push_role: ${{ vars.OIDC_DOCKER_PUSH_ROLE }}
      oidc_docker_pull_role: ${{ vars.OIDC_DOCKER_PULL_ROLE }}
      tag: integration-${{ needs.set_variables.outputs.semver_tag }}
      build_cache_tag: "Preproduction"
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SNYK_OPG_ORG_TOKEN: ${{ secrets.SNYK_OPG_ORG_TOKEN }}

  phpunit_tests:
    name: Run PHPUnit tests
    uses: ./.github/workflows/phpunit.yml
    needs:
      - docker_build_scan_push

  psalm_tests:
    name: Run Psalm analysis
    uses: ./.github/workflows/analysis-psalm.yml
    needs:
      - docker_build_scan_push

  lambda_unit_tests:
    name: Lambda unit tests
    uses: ./.github/workflows/lambda_unit_tests.yml

  terraform_region_preproduction:
    name: TF Preproduction - Region
    uses: ministryofjustice/opg-github-workflows/.github/workflows/build-infrastructure-terraform-oidc.yml@84a762ecab4a2d6217be908505351fd1f9312319 # v3.19.19
    needs:
      - set_variables
      - snyk_iac_scan
      - lambda_unit_tests
    with:
      is_ephemeral: false
      oidc_role_to_assume: ${{ vars.OIDC_TERRAFORM_ROLE_PREPRODUCTION }}
      terraform_apply: true
      terraform_directory: ./terraform/region
      terraform_version: ${{ needs.set_variables.outputs.environment_terraform_version }}
      terraform_workspace: preproduction
    secrets:
      GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PAGERDUTY_TOKEN: ${{ secrets.PAGERDUTY_TOKEN }}
      SSH_PRIVATE_KEY: ${{ secrets.OPG_LPA_DEPLOY_KEY_PRIVATE_KEY }}

  terraform_environment_preproduction:
    name: TF Preproduction - Environment
    uses: ministryofjustice/opg-github-workflows/.github/workflows/build-infrastructure-terraform-oidc.yml@84a762ecab4a2d6217be908505351fd1f9312319 # v3.19.19
    with:
      is_ephemeral: false
      oidc_role_to_assume: ${{ vars.OIDC_TERRAFORM_ROLE_PREPRODUCTION }}
      persist_artifacts: true
      terraform_apply: true
      terraform_directory: ./terraform/environment
      terraform_variables: "-var container_version=integration-${{ needs.set_variables.outputs.semver_tag }}"
      terraform_version: ${{ needs.set_variables.outputs.environment_terraform_version }}
      terraform_workspace: preproduction
      use_ssh_private_key: true
    needs:
      - docker_build_scan_push
      - phpunit_tests
      - psalm_tests
      - set_variables
      - snyk_iac_scan
      - terraform_region_preproduction
    secrets:
      GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PAGERDUTY_TOKEN: ${{ secrets.PAGERDUTY_TOKEN }}
      SSH_PRIVATE_KEY: ${{ secrets.OPG_LPA_DEPLOY_KEY_PRIVATE_KEY }}

  run_preproduction_seed_db_task:
    name: Run preproduction DB seeding
    uses: ./.github/workflows/start_task.yml
    with:
      task_name: "seeding"
      oidc_role: ${{ vars.OIDC_ECS_START_TASK_PREPRODUCTION }}
    needs:
      - terraform_environment_preproduction
      - terraform_region_preproduction

  preprod_terraform_outputs:
    name: Render terraform outputs
    runs-on: ubuntu-latest
    outputs:
      admin_fqdn: ${{ steps.admin_fqdn.outputs.value }}
      front_fqdn: ${{ steps.front_fqdn.outputs.value }}
      mock_onelogin_url: ${{ steps.mock_onelogin_url.outputs.value }}
    needs:
      - terraform_environment_preproduction
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Terraform Task definition
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: terraform-artifact
          path: /tmp/

      - name: Terraform Outputs from JSON
        id: set_var
        run: |
          content=$(cat /tmp/environment_pipeline_tasks_config.json)
          content="${content//'%'/'%25'}"
          content="${content//$'\n'/'%0A'}"
          content="${content//$'\r'/'%0D'}"
          echo "configJson=${content}" >> $GITHUB_OUTPUT

      - name: Extract Admin FQDN from JSON
        id: admin_fqdn
        env:
          configJson: ${{steps.set_var.outputs.configJson}}
        run: | # zizmor: ignore[template-injection]
          echo "value=${{ fromJson(env.configJson).admin_fqdn }}" >> $GITHUB_OUTPUT

      - name: Extract Front FQDN from JSON
        id: front_fqdn
        run: | # zizmor: ignore[template-injection]
          echo "value=${{ fromJson(steps.set_var.outputs.configJson).front_fqdn }}" >> $GITHUB_OUTPUT

      - name: Extract mock One Login URL from JSON
        id: mock_onelogin_url
        run: | # zizmor: ignore[template-injection]
          echo "value=${{ fromJson(steps.set_var.outputs.configJson).mock_onelogin_url }}" >> $GITHUB_OUTPUT

  cypress_tests_Signup_StitchedPF:
    name: Run Cypress tests - Signup,StitchedPF
    uses: ./.github/workflows/cypress_tests.yml
    needs:
      - preprod_terraform_outputs
      - run_preproduction_seed_db_task
    with:
      admin_url: https://${{ needs.preprod_terraform_outputs.outputs.admin_fqdn }}
      front_url: https://${{ needs.preprod_terraform_outputs.outputs.front_fqdn }}
      account_id: "987830934591"
      cypress_tags: "@StitchedPF"
      oidc_ingress_management_role: ${{ vars.OIDC_INGRESS_MANAGEMENT_PREPRODUCTION }}

  cypress_tests_Signup_StitchedHW:
    name: Run Cypress tests - @Signup,@StitchedHW
    uses: ./.github/workflows/cypress_tests.yml
    needs:
      - preprod_terraform_outputs
      - run_preproduction_seed_db_task
    with:
      admin_url: https://${{ needs.preprod_terraform_outputs.outputs.admin_fqdn }}
      front_url: https://${{ needs.preprod_terraform_outputs.outputs.front_fqdn }}
      account_id: "987830934591"
      cypress_tags: "@StitchedHW"
      oidc_ingress_management_role: ${{ vars.OIDC_INGRESS_MANAGEMENT_PREPRODUCTION }}

  cypress_tests_SignupIncluded:
    name: Run Cypress tests - @SignupIncluded
    uses: ./.github/workflows/cypress_tests.yml
    needs:
      - preprod_terraform_outputs
      - run_preproduction_seed_db_task
    with:
      admin_url: https://${{ needs.preprod_terraform_outputs.outputs.admin_fqdn }}
      front_url: https://${{ needs.preprod_terraform_outputs.outputs.front_fqdn }}
      account_id: "987830934591"
      cypress_tags: "@SignupIncluded"
      oidc_ingress_management_role: ${{ vars.OIDC_INGRESS_MANAGEMENT_PREPRODUCTION }}

  # Remaining tests should ultimately just exclude SignUp and anything already done as part of stitched run.
  # TODO CorrespondentReuse needs refactoring so that it can be included as part of the stitchedClone run.
  cypress_tests_Remaining:
    name: Run Cypress tests - Remaining
    uses: ./.github/workflows/cypress_tests.yml
    needs:
      - preprod_terraform_outputs
      - run_preproduction_seed_db_task
    with:
      admin_url: https://${{ needs.preprod_terraform_outputs.outputs.admin_fqdn }}
      front_url: https://${{ needs.preprod_terraform_outputs.outputs.front_fqdn }}
      onelogin_mock_url: ${{ needs.preprod_terraform_outputs.outputs.mock_onelogin_url }}
      account_id: "987830934591"
      cypress_tags: "not @Signup and not @PartOfStitchedRun and not @StitchedHW and not @StitchedPF and not @StitchedClone and not @CorrespondentReuse and not @SignupIncluded and not @AdminSystemMessage and not @CheckoutPaymentGateway and not @Ping and not @RequiresOneLogin"
      oidc_ingress_management_role: ${{ vars.OIDC_INGRESS_MANAGEMENT_PREPRODUCTION }}

  # Signs in through the real GOV.UK One Login integration environment. One Login can change its
  # journey without notice, so this never blocks the merge queue. A failure posts to Slack instead.
  cypress_tests_real_onelogin:
    name: Run Cypress tests - real One Login integration (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    needs:
      - preprod_terraform_outputs
      - run_preproduction_seed_db_task
    environment:
      name: "preproduction"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS Credentials - Ingress Management
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: eu-west-1
          role-to-assume: ${{ vars.OIDC_INGRESS_MANAGEMENT_PREPRODUCTION }}
          role-duration-seconds: 900
          role-session-name: OPGLPACypressRealOneLoginSecurityGroupStart

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        working-directory: scripts/pipeline/ci_ingress
        run: uv sync --locked

      - name: Download Terraform Task definition
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: terraform-artifact
          path: /tmp/

      - name: Add GitHub Actions runner Ingress Rule
        run: |
          uv run --directory scripts/pipeline/ci_ingress python ci_ingress.py /tmp/environment_pipeline_tasks_config.json --add

      - name: Check the One Login integration test account credentials are set
        env:
          ONELOGIN_INTEGRATION_EMAIL: ${{ secrets.ONELOGIN_INTEGRATION_EMAIL }}
          ONELOGIN_INTEGRATION_PASSWORD: ${{ secrets.ONELOGIN_INTEGRATION_PASSWORD }}
          ONELOGIN_INTEGRATION_TOTP_SECRET: ${{ secrets.ONELOGIN_INTEGRATION_TOTP_SECRET }}
        run: |
          for name in ONELOGIN_INTEGRATION_EMAIL ONELOGIN_INTEGRATION_PASSWORD ONELOGIN_INTEGRATION_TOTP_SECRET; do
            if [ -z "${!name}" ] || [ "${!name}" = "default" ]; then
              echo "::error::${name} is not set in the preproduction environment (managed in opg-org-infra, value set by webops)"
              exit 1
            fi
          done

      - name: Run Cypress Tests - @RealOneLogin
        env:
          CYPRESS_adminUrl: https://${{ needs.preprod_terraform_outputs.outputs.admin_fqdn }}
          CYPRESS_baseUrl: https://${{ needs.preprod_terraform_outputs.outputs.front_fqdn }}
          ONELOGIN_INTEGRATION_EMAIL: ${{ secrets.ONELOGIN_INTEGRATION_EMAIL }}
          ONELOGIN_INTEGRATION_PASSWORD: ${{ secrets.ONELOGIN_INTEGRATION_PASSWORD }}
          ONELOGIN_INTEGRATION_TOTP_SECRET: ${{ secrets.ONELOGIN_INTEGRATION_TOTP_SECRET }}
        run: |
          sed -i -e "s|https://front-ssl|${CYPRESS_baseUrl}|g" docker-compose.yml
          sed -i -e "s|https://admin-ssl|${CYPRESS_adminUrl}|g" docker-compose.yml
          mkdir -p cypress/screenshots cypress/downloads
          chmod -R a+w cypress/screenshots cypress/downloads
          docker compose run --rm -e ONELOGIN_INTEGRATION_EMAIL -e ONELOGIN_INTEGRATION_PASSWORD -e ONELOGIN_INTEGRATION_TOTP_SECRET -e CYPRESS_NO_COMMAND_LOG=1 cypress --headless --config video=false -e CI="True" -x stepDefinitions="/app/cypress/e2e/common/*.js",filterSpecs="true",GLOB="cypress/e2e/**/*.feature",tags="@RealOneLogin"

      - name: Upload Screenshot Artifact
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cypress-screenshots (@RealOneLogin)
          path: cypress/screenshots/

      - name: Tell the team on Slack
        if: failure()
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc # v3.0.5
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "C09M1LWJ2G0"
            icon_emoji: ":satellite-antenna:"
            text: "Make - sign in through real GOV.UK One Login integration failed on preproduction"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: ":warning: *Sign in through real GOV.UK One Login integration failed on preproduction.* This does not block the merge queue. One Login may have changed its journey; the failure says which page it did not recognise."
              - type: "context"
                elements:
                  - type: "mrkdwn"
                    text: ":floppy_disk: <https://github.com/ministryofjustice/opg-lpa/commit/${{ github.sha }}|Commit>"
                  - type: "mrkdwn"
                    text: "<https://github.com/ministryofjustice/opg-lpa/actions/runs/${{ github.run_id }}|View workflow and screenshots>"

      - name: Configure AWS Credentials - Ingress Management
        if: always()
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: eu-west-1
          role-to-assume: ${{ vars.OIDC_INGRESS_MANAGEMENT_PREPRODUCTION }}
          role-duration-seconds: 900
          role-session-name: OPGLPACypressRealOneLoginSecurityGroupEnd

      - name: Remove GitHub Actions runner Ingress Rule
        if: always()
        run: |
          uv run --directory scripts/pipeline/ci_ingress python ci_ingress.py /tmp/environment_pipeline_tasks_config.json

  locust_tests:
    name: Run locust tests
    uses: ./.github/workflows/locust_tests.yml
    needs:
      - preprod_terraform_outputs
      - run_preproduction_seed_db_task
    with:
      front_url: https://${{ needs.preprod_terraform_outputs.outputs.front_fqdn }}
      oidc_ingress_management_role: ${{ vars.OIDC_INGRESS_MANAGEMENT_PREPRODUCTION }}

  end_of_workflow:
    name: End of Workflow
    runs-on: ubuntu-latest
    needs:
      - terraform_environment_preproduction
      - preprod_terraform_outputs
      - set_variables
      - cypress_tests_Signup_StitchedPF
      - cypress_tests_Signup_StitchedHW
      - cypress_tests_SignupIncluded
      - cypress_tests_Remaining
      - locust_tests
    environment:
      name: "preproduction"
      url: "https://${{ env.FRONT_URL }}/home"
    env:
      FRONT_URL: ${{ needs.preprod_terraform_outputs.outputs.front_fqdn }}
    steps:
      - name: End of Workflow
        run: |
          if ${{ contains(needs.terraform_environment_preproduction.result, 'success')}} &&
            ${{ contains(needs.preprod_terraform_outputs.result, 'success')}} &&
            ${{ contains(needs.cypress_tests_Signup_StitchedPF.result, 'success')}} &&
            ${{ contains(needs.cypress_tests_Signup_StitchedHW.result, 'success')}} &&
            ${{ contains(needs.cypress_tests_SignupIncluded.result, 'success')}} &&
            ${{ contains(needs.cypress_tests_Remaining.result, 'success')}} &&
            ${{ contains(needs.locust_tests.result, 'success')}}; then
            echo "Preproduction environment tested, built and deployed"
            echo "Tag Deployed: integration-${SEMVER_TAG}"
            echo "URL: https://${FRONT_URL}/home"
            exit 0
          else
            echo "Previous jobs in pipeline failed."
            exit 1
          fi
        env:
          SEMVER_TAG: ${{ needs.set_variables.outputs.semver_tag }}
    if: always()
